# Decap CMS (formerly Netlify CMS) — edit at https://yoursite.netlify.app/admin
backend:
  name: git-gateway
  branch: main

# Enable Netlify Identity + Git Gateway in Netlify dashboard:
# Site settings → Identity → Enable, then Services → Git Gateway

media_folder: public/images/uploads
public_folder: /images/uploads

local_backend: true

collections:
  - name: posts
    label: Journal Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Publish Date, name: pubDate, widget: datetime }
      - { label: Cover Image, name: image, widget: image, required: false }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        summary: "{{fields.image}}"
        field: { label: Image, name: image, widget: image }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          - kitchen
          - office
          - bedroom
      - { label: Image, name: image, widget: image }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        summary: "{{fields.image}}"
        field: { label: Image, name: image, widget: image }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Sort Order, name: order, widget: number, default: 0 }
      - { label: Details, name: body, widget: markdown, required: false }
